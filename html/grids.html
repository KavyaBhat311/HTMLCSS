<!DOCTYPE html>
<html>
    <head>
        <title>Grids</title>
    </head>
    <body>
        <div style="display: grid;
             grid-template-columns: 406px 1090px 406px;
             grid-template-rows: 930px 930px 930px;
             height: 940px;
             width: 1200px;">
            <div style="background-color: rgb(84, 8, 8); color: white; margin-right: 6px;">div 1</div>
            <div style="background-color: rgb(142, 3, 3); color: white; margin-right: 6px;">div 2</div>
            <div style="background-color: rgb(68, 18, 18); color: white;">div 3</div>
        </div>
        <div style="display: grid;
             grid-template-columns: 1902px;
             grid-template-rows: 100px;
             height: 50px;
             width: 1200px;">
            <div style="background-color: rgb(84, 8, 8); color: white;">div 4</div>
        </div>
    </body>
</html>
